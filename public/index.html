<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>网格总看板 · 8088</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel2: #1f2630;
      --border: #30363d;
      --txt: #e6edf3;
      --mut: #8b949e;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --blue: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--txt);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.45;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(13, 17, 23, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    h1 { font-size: 20px; font-weight: 800; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mut); display: inline-block; }
    .dot.on { background: var(--green); box-shadow: 0 0 10px var(--green); }
    .dot.off { background: var(--red); }
    .meta { color: var(--mut); font-size: 12px; }
    .pill {
      border: 1px solid var(--border); border-radius: 999px;
      padding: 4px 10px; font-size: 12px; background: var(--panel);
    }
    .pill.live { color: var(--green); border-color: #238636; }
    .pill.dry { color: var(--yellow); border-color: #9e6a03; }
    .pill.offok { color: var(--blue); border-color: #1f6feb; }
    .pill.paused { color: #fff; background: #8b1a1a; border-color: #f85149; }
    .btn-panic {
      margin-left: auto;
      border: 1px solid #f85149;
      background: #3a1618;
      color: #ff7b72;
      font-weight: 800;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-panic:hover { background: #5a1e22; color: #fff; }
    .btn-panic:disabled { opacity: 0.55; cursor: wait; }
    .btn-resume {
      border: 1px solid #238636;
      background: #14351f;
      color: var(--green);
      font-weight: 800;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-resume:hover { background: #1a4d28; }
    .btn-resume:disabled { opacity: 0.55; cursor: wait; }
    .pause-banner {
      display: none; padding: 12px 14px; margin-bottom: 14px;
      border: 1px solid #f85149; border-radius: 12px;
      color: #ff7b72; background: #3a1618; font-weight: 700;
    }
    .pause-banner.on { display: block; }
    main { max-width: 1280px; margin: 0 auto; padding: 18px; }
    .section-title {
      margin: 28px 0 14px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }
    .section-title.t-overview { color: #58a6ff; }
    .section-title.t-venues { color: #d29922; }
    .section-title.t-cal { color: #39c5cf; }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 12px; }
    .kpi, .alert {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    }
    .kpi { padding: 16px; min-height: 96px; }
    .kpi label { display: block; color: var(--mut); font-size: 12px; margin-bottom: 6px; }
    .kpi .value {
      font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere; word-break: break-all; min-height: 1.2em;
    }
    .kpi .value.up { color: var(--green); }
    .kpi .value.down { color: var(--red); }
    .sub { color: var(--mut); font-size: 12px; margin-top: 7px; }
    .up { color: var(--green); }
    .down { color: var(--red); }
    .warn { color: var(--yellow); }
    .alert {
      display: none; padding: 12px 14px; margin-bottom: 14px;
      border-color: #d2992255; color: #f2cc60; background: #2d250d;
    }
    .table {
      width: 100%; border-collapse: collapse; background: var(--panel);
      border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    }
    .table th, .table td {
      padding: 10px; border-bottom: 1px solid var(--border);
      text-align: left; font-size: 13px; white-space: nowrap;
    }
    .table th { color: var(--mut); font-weight: 600; background: var(--panel2); }
    .table tr:last-child td { border-bottom: 0; }
    .scroll { overflow-x: auto; }
    .scroll.fit { overflow-x: hidden; }
    .table-fit { table-layout: fixed; width: 100%; }
    .table-fit th, .table-fit td {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 8px 6px;
    }
    .table-fit .btn-rehang { padding: 4px 8px; font-size: 12px; }
    .badge {
      display: inline-block; border-radius: 999px; padding: 3px 8px;
      font-size: 12px; font-weight: 700;
    }
    .badge.ok { background: #14351f; color: var(--green); }
    .badge.busy { background: #332a12; color: var(--yellow); }
    .badge.down { background: #3a1618; color: var(--red); }
    .badge.blown { background: #4a0e10; color: #ff6b6b; border: 1px solid #f85149; }
    .btn-rehang {
      border: 1px solid #1f6feb; background: #12233a; color: #79c0ff;
      font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 6px; cursor: pointer;
    }
    .btn-rehang:hover { background: #1a3354; }
    .btn-rehang:disabled { opacity: 0.55; cursor: wait; }
    .section-title.t-stop { color: #f85149; }
    .ladders {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 8px;
    }
    .ladder {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .ladder-head {
      display: flex; flex-wrap: wrap; gap: 8px 16px;
      align-items: baseline; justify-content: space-between;
      font-size: 13px;
    }
    .ladder-head .name { font-weight: 800; font-size: 15px; }
    .ladder-head .stat { color: var(--mut); font-variant-numeric: tabular-nums; }
    .ladder-head .stat.bad { color: var(--yellow); font-weight: 700; }
    .ladder-head .stat.ok { color: var(--green); }
    .ladder-rail {
      position: relative;
      height: 52px;
      margin-top: 12px;
      border-radius: 8px;
      background: #0d1117;
      border: 1px solid var(--border);
      overflow: visible;
    }
    .ladder-gap {
      position: absolute;
      top: 10px;
      height: 32px;
      background: rgba(210, 153, 34, 0.35);
      border: 1px solid rgba(210, 153, 34, 0.7);
      border-radius: 3px;
      z-index: 1;
    }
    .ladder-tick {
      position: absolute;
      top: 8px;
      width: 3px;
      height: 36px;
      border-radius: 1px;
      background: var(--blue);
      z-index: 2;
    }
    .ladder-tick.buy { background: var(--green); }
    .ladder-tick.sell { background: var(--red); }
    .ladder-mid {
      position: absolute;
      top: 0; bottom: 0;
      width: 3px;
      margin-left: -1px;
      background: #ffd666;
      box-shadow: 0 0 8px rgba(255, 214, 102, 0.7);
      z-index: 3;
    }
    .ladder-anchor {
      position: absolute;
      top: 0; bottom: 0;
      width: 3px;
      margin-left: -1px;
      background: #a371f7;
      box-shadow: 0 0 8px rgba(163, 113, 247, 0.65);
      z-index: 3;
    }
    .ladder-anchor.near-mid {
      /* 与 mid 几乎重合时略加宽，仍能辨认 */
      width: 5px;
      margin-left: -2px;
      opacity: 0.85;
    }
    .ladder-legend {
      display: flex; flex-wrap: wrap; gap: 10px 16px;
      margin-top: 6px; color: var(--mut); font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .ladder-legend i {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 2px; margin-right: 4px; vertical-align: -1px;
    }
    .ladder-legend .lg-mid { background: #ffd666; }
    .ladder-legend .lg-anchor { background: #a371f7; }
    .ladder-legend .lg-buy { background: var(--green); }
    .ladder-legend .lg-sell { background: var(--red); }
    .ladder-axis {
      display: flex; justify-content: space-between;
      margin-top: 8px; color: var(--mut); font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .ladder-hint { color: var(--mut); font-size: 11px; margin-top: 4px; }
    .ladder-empty { color: var(--mut); font-size: 12px; padding: 10px 0 2px; }
    .section-title.t-ladder { color: #a371f7; margin-top: 18px; }
    @media (max-width: 900px) {
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 600px) {
      body { padding: 0; padding-bottom: env(safe-area-inset-bottom); }
      header { padding: 10px 12px; gap: 8px; }
      h1 { font-size: 16px; }
      .btn-panic, .btn-resume { padding: 6px 10px; font-size: 12px; }
      main { padding: 12px; }
      .kpis { grid-template-columns: 1fr 1fr; gap: 8px; }
      .kpi { padding: 12px; min-height: 78px; }
      .kpi .value { font-size: 19px; }
      .section-title { font-size: 18px; margin: 20px 0 10px; }
      .table th, .table td { padding: 6px 3px; font-size: 11px; }
      .table-fit th, .table-fit td { padding: 6px 3px; font-size: 11px; }
      .table-fit .btn-rehang { padding: 5px 6px; font-size: 11px; width: 100%; }
      .badge { padding: 2px 5px; font-size: 10px; }
      .ladder { padding: 10px 10px; }
      .ladder-rail { height: 44px; }
    }
    @media (max-width: 520px) {
      .kpis { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <span id="dot" class="dot"></span>
    <h1>网格总看板</h1>
    <span id="mode" class="pill dry">…</span>
    <span id="pausePill" class="pill" style="display:none">暂停中</span>
    <span id="offPill" class="pill">数据…</span>
    <span id="time" class="meta">等待数据</span>
    <button type="button" id="btnPause" class="btn-panic" title="停止机器人一切下单/撤单/补单">紧急暂停</button>
    <button type="button" id="btnResume" class="btn-resume" style="display:none" title="恢复机器人自动网格">恢复运行</button>
  </header>
  <main>
    <div id="pauseBanner" class="pause-banner">紧急暂停中：机器人已停止操作。请自行到各所撤单/平仓；完成后再点「恢复运行」。</div>
    <div id="alert" class="alert"></div>

    <p class="section-title t-overview">总览</p>
    <section class="kpis">
      <div class="kpi">
        <label>总利润</label>
        <div id="kOffPnl" class="value">-</div>
        <div id="kOffPnlSub" class="sub"></div>
      </div>
      <div class="kpi">
        <label>总余额</label>
        <div id="kEquity" class="value">-</div>
        <div id="kEquitySub" class="sub"></div>
      </div>
      <div class="kpi">
        <label>总成交量</label>
        <div id="kVol" class="value">-</div>
        <div id="kVolSub" class="sub">官方累计</div>
      </div>
      <div class="kpi">
        <label>挂单合计</label>
        <div id="kOrders" class="value">-</div>
        <div id="kOrdersSub" class="sub">open / 期望≈</div>
      </div>
    </section>

    <p class="section-title t-venues">各所状态汇总</p>
    <div class="scroll fit">
      <table class="table table-fit">
        <thead>
          <tr>
            <th>交易所</th><th>状态</th><th>方向</th><th>仓位</th>
            <th>权益</th><th>成交</th><th>浮盈</th><th>重挂</th>
          </tr>
        </thead>
        <tbody id="venueRows"></tbody>
      </table>
    </div>
    <p class="section-title t-ladder">挂单档位分布</p>
    <div id="venueLadders" class="ladders"></div>

  </main>
  <script>
    const LABELS = { risex: "RISEx", decibel: "Decibel", n1: "N1", popdex: "PopDEX" };
    const COLORS = { risex: "#3fb950", decibel: "#d29922", n1: "#39c5cf", popdex: "#e85d75" };
    const ORDER = ["decibel", "n1", "popdex", "risex"];

    function el(id) { return document.getElementById(id); }
    function setText(id, text, className) {
      const node = el(id);
      if (!node) return;
      node.textContent = text;
      if (className != null) node.className = className;
    }
    function n(v) { const x = Number(v); return Number.isFinite(x) ? x : 0; }
    function usd(v) {
      return "$" + n(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function usdShort(v) {
      return "$" + n(v).toLocaleString("en-US", { maximumFractionDigits: 0 });
    }
    function signed(v) {
      const x = n(v);
      return (x > 0 ? "+" : "") + usd(x);
    }
    function price(v) {
      const x = n(v);
      if (!x) return "-";
      if (Math.abs(x) >= 1000) return x.toFixed(1);
      return x.toFixed(2);
    }
    function cls(v) { return n(v) > 0 ? "up" : n(v) < 0 ? "down" : ""; }
    function expectOo(v) { return Math.max(0, n(v.gridCount)); }
    function statusOf(v) {
      // 爆仓：权益跌破阈值且仓位归零（正常各所权益数百+，爆仓后骤降到个位数）
      const eq = n(v.equityUsd);
      if (eq > 0 && eq < 100 && Math.abs(n(v.position)) < 1e-9) return "blown";
      if (v.lastError) return "down";
      if (!v.mid) return "down";
      if (!v.seeded && n(v.openOrders) === 0) return "busy";
      const exp = expectOo(v);
      if (exp > 0 && n(v.openOrders) < exp * 0.5) return "busy";
      return "ok";
    }
    function statusLabel(s) {
      return s === "ok" ? "正常" : s === "busy" ? "铺单中" : s === "blown" ? "爆仓" : "异常";
    }
    function sideLabel(pos) {
      const p = n(pos);
      if (p > 1e-12) return "多";
      if (p < -1e-12) return "空";
      return "平";
    }
    function px0(x) { return x > 0 ? Math.round(x).toString() : "-"; }
    function stopLevels(v) {
      const sl = v.stopLoss || {};
      const lo = n(v.lower);
      const hi = n(v.upper);
      const hardUp = sl.hardUp != null && Number(sl.hardUp) > 0 ? Number(sl.hardUp) : (hi > 0 ? hi * 1.025 : 0);
      const hardDn = sl.hardDn != null && Number(sl.hardDn) > 0 ? Number(sl.hardDn) : (lo > 0 ? lo * 0.975 : 0);
      const ladUp = hi > 0 ? hi * 1.01 : 0;
      const ladDn = lo > 0 ? lo * 0.99 : 0;
      const pos = n(v.position);
      const mid = n(v.mid);
      let est = null;
      if (Math.abs(pos) > 1e-12 && mid > 0) {
        const px = pos > 0 ? hardDn : hardUp;
        if (px > 0) est = pos * (px - mid);
      }
      return { hardUp, hardDn, ladUp, ladDn, est };
    }

    /** 挂单档位横轴：看档距是否均匀；黄块=空洞 */
    function renderLadder(v, id) {
      const orders = Array.isArray(v.orders) ? v.orders : [];
      let buyN = 0, sellN = 0;
      for (const o of orders) { if (o.side === "sell") sellN++; else buyN++; }
      const lv = stopLevels(v);
      const sl = v.stopLoss || {};
      const mid = n(v.mid);
      const expectGap = n(v.spacing);
      const sorted = orders
        .map((o) => ({ px: n(o.price), side: String(o.side || "") }))
        .filter((o) => o.px > 0)
        .sort((a, b) => a.px - b.px);
      const uniq = [];
      const uniqSide = [];
      for (const o of sorted) {
        if (!uniq.length || Math.abs(o.px - uniq[uniq.length - 1]) > 1e-6) {
          uniq.push(o.px);
          uniqSide.push(o.side);
        }
      }

      let lo = n(v.lower);
      let hi = n(v.upper);
      if (!(lo > 0) || !(hi > 0) || hi <= lo) {
        if (uniq.length >= 2) {
          lo = uniq[0];
          hi = uniq[uniq.length - 1];
        } else if (mid > 0) {
          lo = mid * 0.97;
          hi = mid * 1.03;
        } else {
          return `<div class="ladder"><div class="ladder-head"><span class="name" style="color:${COLORS[id]}">${LABELS[id]}</span></div><div class="ladder-empty">无价格轴</div></div>`;
        }
      }
      const pad = (hi - lo) * 0.015;
      const axisLo = lo - pad;
      const axisHi = hi + pad;
      const span = axisHi - axisLo || 1;
      const pctOf = (px) => Math.max(0, Math.min(100, ((px - axisLo) / span) * 100));

      const gaps = [];
      for (let i = 1; i < uniq.length; i++) gaps.push(uniq[i] - uniq[i - 1]);
      const avgGap = gaps.length ? gaps.reduce((s, x) => s + x, 0) / gaps.length : 0;
      const maxGap = gaps.length ? Math.max(...gaps) : 0;
      const baseGap = expectGap > 0 ? expectGap : avgGap;
      // 前紧后松：普通所外层约 1.3–1.8 倍内层；N1 中心加密后约 4 倍，两种都认
      const nearOuter = gaps.filter((g) => g > baseGap * 1.25 && g < baseGap * 1.85);
      const farOuter = gaps.filter((g) => g > baseGap * 2.2 && g < baseGap * 5.5);
      const outerish = farOuter.length >= 3 ? farOuter : nearOuter;
      const outerGap = outerish.length >= 3
        ? outerish.reduce((s, x) => s + x, 0) / outerish.length
        : 0;
      const holeThresh = (outerGap > 0 ? outerGap : baseGap) * 1.6;
      // 中间 skipBand：买卖跨 mid 的跳空是设计预期，不算缺档空洞
      const midSkipMax = (outerGap > 0 ? outerGap : baseGap) * 2.25;
      let holes = 0;
      let missingEst = 0;
      let midSkipGap = 0;
      const gapMarks = [];
      if (holeThresh > 0) {
        for (let i = 1; i < uniq.length; i++) {
          const g = uniq[i] - uniq[i - 1];
          const a = uniq[i - 1];
          const b = uniq[i];
          const crossesMid = mid > 0 && a < mid && b > mid;
          if (crossesMid && midSkipMax > 0 && g <= midSkipMax) {
            midSkipGap = Math.max(midSkipGap, g);
            continue;
          }
          if (g <= holeThresh) continue;
          holes += 1;
          missingEst += Math.max(0, Math.round(g / baseGap) - 1);
          const left = pctOf(a);
          const right = pctOf(b);
          const w = Math.max(0.4, right - left);
          gapMarks.push(
            `<span class="ladder-gap" style="left:${left}%;width:${w}%" title="空洞 ${g.toFixed(1)} · ${price(a)}→${price(b)}"></span>`
          );
        }
      }

      const ticks = uniq
        .map((px, i) => {
          const side = uniqSide[i] === "sell" ? "sell" : "buy";
          const sideTxt = side === "buy" ? "买" : "卖";
          return `<span class="ladder-tick ${side}" style="left:${pctOf(px)}%" title="${sideTxt} ${price(px)}"></span>`;
        })
        .join("");
      const anchor = n(v.anchorMid);
      const midMark =
        mid > 0
          ? `<span class="ladder-mid" style="left:${pctOf(mid)}%" title="当前价 mid ${price(mid)}"></span>`
          : "";
      const near = mid > 0 && anchor > 0 && Math.abs(mid - anchor) / Math.max(mid, 1) < 0.0008;
      const anchorMark =
        anchor > 0
          ? `<span class="ladder-anchor${near ? " near-mid" : ""}" style="left:${pctOf(anchor)}%" title="铺单锚点 ${price(anchor)}"></span>`
          : "";
      const gapText = outerGap > 0
        ? `格距 内${baseGap.toFixed(1)} 外${outerGap.toFixed(1)}`
        : `格距 ${baseGap.toFixed(1)}`;
      let statCls = "ok";
      let statText = `${gapText} · ${uniq.length}档`;
      if (!uniq.length) {
        statCls = "";
        statText = "无挂单";
      } else if (holes > 0 && uniq.length < n(v.gridCount)) {
        statCls = "bad";
        statText = `${gapText} · 缺${missingEst}档`;
      }

      return `<div class="ladder">
        <div class="ladder-head">
          <span class="name" style="color:${COLORS[id]}">● ${LABELS[id]}</span>
          <span class="stat ${statCls}">${statText}</span>
        </div>
        ${uniq.length
          ? `<div class="ladder-rail">${gapMarks.join("")}${ticks}${anchorMark}${midMark}</div>
        <div class="ladder-axis"><span>${price(lo)}</span><span>${price(hi)}</span></div>
        <div class="ladder-legend">
          <span><i class="lg-mid"></i>当前价 ${mid > 0 ? price(mid) : "-"}</span>
          <span><i class="lg-anchor"></i>铺单锚点 ${anchor > 0 ? price(anchor) : "-"}</span>
          <span><i class="lg-buy"></i>买 ${buyN}</span>
          <span><i class="lg-sell"></i>卖 ${sellN}</span>
          <span>阶梯 下 ${px0(lv.ladDn)} / 上 ${px0(lv.ladUp)}</span>
          <span>硬止 下 ${px0(lv.hardDn)} / 上 ${px0(lv.hardUp)}</span>
          ${sl.openLock === "long" ? "<span>止损后只留买单</span>" : sl.openLock === "short" ? "<span>止损后只留卖单</span>" : ""}
        </div>`
          : `<div class="ladder-empty">暂无挂单明细</div>`}
      </div>`;
    }

    function render(data) {
      const venues = Array.isArray(data.venues) ? data.venues.slice() : [];
      const byId = {};
      for (const v of venues) byId[v.venue] = v;
      const orderList = [];
      for (const id of ORDER) {
        if (byId[id]) orderList.push(id);
      }
      for (const v of venues) {
        if (v && v.venue && !orderList.includes(v.venue)) orderList.push(v.venue);
      }
      const oo = venues.reduce((s, v) => s + n(v.openOrders), 0);
      const exp = venues.reduce((s, v) => s + expectOo(v), 0);
      const healthy = venues.filter((v) => statusOf(v) === "ok").length;
      const alerts = venues.filter((v) => v.lastError).map((v) => `${v.venue}: ${v.lastError}`);
      const ledger = data.ledger || {};
      const cal = Array.isArray(ledger.calendar) ? ledger.calendar : [];
      const todayRow = cal.find((r) => r.day === ledger.dayKey) || cal[0];
      const off = data.official || {};
      const offVenues = off.venues || {};
      let offVol = 0, offVolN = 0;
      for (const id of orderList) {
        const o = offVenues[id];
        if (!o || o.source !== "official") continue;
        if (o.volume != null && Number.isFinite(Number(o.volume))) { offVol += Number(o.volume); offVolN++; }
      }
      const venueEquity = venues.reduce((s, v) => s + n(v.equityUsd), 0);
      const ledgerEquity = todayRow ? n(todayRow.equity) : 0;
      const todayEquity = venueEquity > 0 ? venueEquity : ledgerEquity;

      const PROFIT_BASE_EQUITY = 4021.997;
      const totalProfit = todayEquity > 0 ? todayEquity - PROFIT_BASE_EQUITY : null;
      let totalVol = 0, totalVolN = 0;
      for (const r of cal) {
        const isToday = r.day === ledger.dayKey;
        const vol = isToday && offVolN > 0
          ? offVol
          : (r.officialVolume != null && Number.isFinite(Number(r.officialVolume))
              ? Number(r.officialVolume)
              : (r.volume != null && Number.isFinite(Number(r.volume)) ? Number(r.volume) : null));
        if (vol != null) { totalVol += vol; totalVolN++; }
      }
      if (!totalVolN && offVolN > 0) { totalVol = offVol; totalVolN = offVolN; }
      setText("mode", data.dryRun ? "DRY_RUN" : "LIVE", "pill " + (data.dryRun ? "dry" : "live"));
      const paused = !!data.paused;
      const pausePill = el("pausePill");
      const btnPause = el("btnPause");
      const btnResume = el("btnResume");
      const pauseBanner = el("pauseBanner");
      if (pausePill) {
        pausePill.style.display = paused ? "inline-block" : "none";
        if (paused) setText("pausePill", "暂停中", "pill paused");
      }
      if (btnPause) btnPause.style.display = paused ? "none" : "inline-block";
      if (btnResume) btnResume.style.display = paused ? "inline-block" : "none";
      if (pauseBanner) {
        pauseBanner.className = "pause-banner" + (paused ? " on" : "");
        if (paused && data.pausedAt) {
          pauseBanner.textContent =
            "紧急暂停中（" + new Date(data.pausedAt).toLocaleString("zh-CN") +
            "）：机器人已停止下单/撤单/补单。请自行到各所撤单/平仓；完成后再点「恢复运行」。";
        }
      }
      setText("offPill", offVolN === orderList.length ? "数据齐全" : `数据 ${offVolN}/${orderList.length}`, "pill " + (offVolN === orderList.length ? "offok" : "dry"));
      setText("kEquity", todayEquity > 0 ? usd(todayEquity) : "-");
      setText("kEquitySub", "");
      setText("kVol", totalVolN > 0 ? usdShort(totalVol) : "-");
      setText("kVolSub", totalVolN ? `累计 ${cal.length || 1} 日官方量` : "暂无");
      setText(
        "kOffPnl",
        totalProfit != null ? signed(totalProfit) : "-",
        "value " + (totalProfit != null ? cls(totalProfit) : "")
      );
      setText("kOffPnlSub", "");
      setText("kOrders", String(oo));
      setText("kOrdersSub", `open ${oo} / 期望≈${exp}`);

      el("venueRows").innerHTML = orderList.map((id) => {
        const v = byId[id];
        if (!v) {
          return `<tr><td>${LABELS[id] || id}</td><td colspan="7" class="meta">暂无数据</td></tr>`;
        }
        const st = statusOf(v);
        const side = sideLabel(v.position);
        const sideCls = side === "多" ? "up" : side === "空" ? "down" : "";
        const posU = Math.abs(n(v.position) * n(v.mid));
        const posULabel = n(v.mid) > 0 ? usdShort(posU) : "-";
        const o = offVenues[id] || {};
        const volOk = o.source === "official" && o.volume != null && Number.isFinite(Number(o.volume));
        return `<tr>
          <td><span style="color:${COLORS[id] || "#8b949e"}">●</span> ${LABELS[id] || id}</td>
          <td><span class="badge ${st}">${statusLabel(st)}</span></td>
          <td class="${sideCls}">${side}</td>
          <td class="${sideCls}">${posULabel}</td>
          <td>${v.equityUsd != null ? usdShort(v.equityUsd) : "-"}</td>
          <td>${volOk ? usdShort(o.volume) : "-"}</td>
          <td class="${v.unrealizedPnl != null && Number.isFinite(n(v.unrealizedPnl)) ? cls(v.unrealizedPnl) : ""}">${v.unrealizedPnl != null && Number.isFinite(n(v.unrealizedPnl)) ? signed(v.unrealizedPnl).replace(".00","") : "-"}</td>
          <td><button type="button" class="btn-rehang" data-rehang="${id}">重挂</button></td>
        </tr>`;
      }).join("");

      const ladders = el("venueLadders");
      if (ladders) {
        ladders.innerHTML = orderList.map((id) => {
          const v = byId[id];
          if (!v) {
            return `<div class="ladder"><div class="ladder-head"><span class="name">${LABELS[id] || id}</span></div><div class="ladder-empty">暂无数据</div></div>`;
          }
          return renderLadder(v, id);
        }).join("");
      }

      const box = el("alert");
      if (alerts.length) {
        box.style.display = "block";
        box.textContent = alerts.join("；");
      } else {
        box.style.display = "none";
        box.textContent = "";
      }

      el("time").textContent = "更新 " + new Date(data.updatedAt || Date.now()).toLocaleTimeString("zh-CN");
      el("dot").className = "dot on";
    }

    async function poll() {
      try {
        const r = await fetch("/api/snapshot?_=" + Date.now(), { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        render(await r.json());
      } catch (e) {
        el("dot").className = "dot off";
        el("time").textContent = "读取失败: " + (e && e.message ? e.message : e);
      }
    }

    async function setPaused(paused) {
      const btn = paused ? el("btnPause") : el("btnResume");
      if (btn) btn.disabled = true;
      try {
        const r = await fetch(paused ? "/api/pause" : "/api/resume", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ reason: "dashboard-ui" }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || j.ok === false) throw new Error(j.error || ("HTTP " + r.status));
        await poll();
      } catch (e) {
        alert((paused ? "暂停失败：" : "恢复失败：") + (e && e.message ? e.message : e));
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    el("btnPause").addEventListener("click", () => {
      if (!confirm("确认紧急暂停？\n\n机器人将立刻停止一切下单 / 撤单 / 补单。\n挂单与仓位不会自动处理，请你自己去各所手动撤单、平仓。")) return;
      void setPaused(true);
    });
    el("btnResume").addEventListener("click", () => {
      if (!confirm("确认恢复运行？\n\n机器人将重新开始自动补单/铺网格。\n若你已手动清仓撤单，恢复后可能会按当前锚点重新挂单。")) return;
      void setPaused(false);
    });

    const REHANG_OK = { decibel: 1, n1: 1, popdex: 1, risex: 1 };
    document.addEventListener("click", async (ev) => {
      const btn = ev.target && ev.target.closest ? ev.target.closest("[data-rehang]") : null;
      if (!btn) return;
      const venue = String(btn.getAttribute("data-rehang") || "").trim();
      if (!REHANG_OK[venue]) return;
      if (!confirm(`确认按当前仓位重挂 ${LABELS[venue] || venue}？\n\n仓位不动。会先停网格、按现仓改买卖挂单并平移止损，再软启。`)) return;
      btn.disabled = true;
      try {
        const urls = ["/api/rehang", location.protocol + "//" + location.hostname + ":8089/rehang"];
        let lastErr = "重挂接口不可用";
        let ok = false;
        for (const url of urls) {
          try {
            const r = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ venue }),
            });
            const j = await r.json().catch(() => ({}));
            if (r.ok && j.ok !== false) { ok = true; break; }
            lastErr = j.error || ("HTTP " + r.status);
          } catch (e) {
            lastErr = e && e.message ? e.message : String(e);
          }
        }
        if (!ok) throw new Error(lastErr);
        alert((LABELS[venue] || venue) + " 重挂已开始，看板会短暂掉线，稍后刷新。");
      } catch (e) {
        alert("重挂失败：" + (e && e.message ? e.message : e));
      } finally {
        btn.disabled = false;
      }
    });

    poll();
    setInterval(poll, 3000);
  </script>
</body>
</html>
